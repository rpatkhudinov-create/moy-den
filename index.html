<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мой день</title>
<meta name="theme-color" content="#f6f6f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Мой день">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<style>
  /* Одна колонка 560px по центру: шапка → переключатель → цели и прогресс → timeline → неделя.
     Светлая тема по просьбе пользователя (одна тема, все цвета заданы явно). */
  :root {
    --bg: #f6f6f3;
    --card: #ffffff;
    --ink: #1f2328;
    --ink-2: #5d6470;
    --ink-3: #8b929c;
    --line: rgba(0, 0, 0, 0.07);
    --track: #ebebe5;
    --tag: #f1f1ec;
    --ring: #d6d8dc;
    --focus: #5b7cfa;
    --sofra: #f08a3c;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }

  button { font: inherit; color: inherit; }

  .page {
    max-width: 560px;
    margin: 0 auto;
    padding-block: max(28px, env(safe-area-inset-top)) max(56px, env(safe-area-inset-bottom));
    padding-inline: 16px;
  }

  .header h1 {
    margin: 0;
    font-size: 32px;
    line-height: 1.1;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .date { margin: 6px 0 0; color: var(--ink-2); font-size: 16px; }

  .mode {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    margin-top: 20px;
    padding: 4px;
    background: var(--track);
    border-radius: 14px;
  }

  .mode-btn {
    min-height: 48px;
    padding: 0 12px;
    border: 0;
    border-radius: 11px;
    background: transparent;
    color: var(--ink-2);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, box-shadow 0.15s;
  }

  .mode-btn.active {
    background: var(--card);
    color: var(--ink);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.05);
  }

  .mode-btn:focus-visible, .check:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .goals {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 14px;
    margin-top: 16px;
    font-size: 15px;
  }

  .section-label {
    width: 100%;
    color: var(--ink-3);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .goal { font-weight: 500; }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 14px;
  }

  .stat {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    min-width: 0;
  }

  .stat-label { display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13px; }

  .stat-value {
    font-size: 17px;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .stat-value.muted { color: var(--ink-3); font-size: 14px; font-weight: 500; padding-top: 2px; }

  .dot { display: inline-block; flex: none; width: 8px; height: 8px; border-radius: 50%; }

  .timeline { list-style: none; margin: 24px 0 0; padding: 0; }

  .item {
    position: relative;
    display: grid;
    grid-template-columns: 20px minmax(0, 1fr);
    gap: 10px;
    padding-bottom: 10px;
  }

  .rail { position: relative; display: flex; justify-content: center; }

  .rail::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: -10px;
    width: 2px;
    background: var(--line);
  }

  .item:first-child .rail::before { top: 22px; }
  .item:last-child .rail::before { bottom: calc(100% - 22px); }

  .rail-dot {
    position: relative;
    margin-top: 17px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--cat);
    box-shadow: 0 0 0 3px var(--bg);
  }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; }

  .block {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 12px 12px 16px;
    transition: opacity 0.2s, border-color 0.2s, box-shadow 0.2s;
  }

  .block-body { flex: 1; min-width: 0; }

  .block-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 10px;
    font-size: 13px;
    color: var(--ink-2);
  }

  .time { font-variant-numeric: tabular-nums; font-weight: 600; }

  .chip { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-3); }

  .tag { padding: 1px 8px; border-radius: 999px; background: var(--tag); color: var(--ink-2); font-size: 12px; }

  .now-tag { padding: 1px 8px; border-radius: 999px; background: var(--cat); color: var(--card); font-size: 12px; font-weight: 600; }

  .title { margin: 4px 0 0; font-size: 17px; font-weight: 600; line-height: 1.3; }

  .note { margin: 4px 0 0; font-size: 13px; color: var(--ink-3); }

  .check {
    flex: none;
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    margin-top: 2px;
    padding: 0;
    border: 2px solid var(--ring);
    border-radius: 50%;
    background: var(--card);
    color: transparent;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
    -webkit-tap-highlight-color: transparent;
  }

  .check svg { width: 18px; height: 18px; }

  @media (hover: hover) {
    .check:hover { border-color: var(--cat); color: var(--ring); }
  }

  .item.now .block {
    border-color: color-mix(in srgb, var(--cat) 45%, transparent);
    box-shadow: 0 2px 14px color-mix(in srgb, var(--cat) 16%, transparent);
  }

  .item.now .rail-dot {
    width: 14px;
    height: 14px;
    margin-top: 15px;
    box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px color-mix(in srgb, var(--cat) 25%, transparent);
  }

  .item.done .block { opacity: 0.5; box-shadow: none; }
  .item.done .rail-dot { opacity: 0.5; }
  .item.done .check { background: var(--cat); border-color: var(--cat); color: var(--card); }

  .week { margin-top: 20px; padding: 16px; }

  .week-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }

  .week h2 { margin: 0; font-size: 15px; font-weight: 600; text-wrap: balance; }

  .week-value { flex: none; font-weight: 650; font-variant-numeric: tabular-nums; }

  .bar { height: 10px; margin-top: 12px; border-radius: 999px; background: var(--track); overflow: hidden; }

  .bar-fill { height: 100%; border-radius: 999px; background: var(--sofra); transition: width 0.3s; }

  .week-range { margin: 10px 0 0; font-size: 13px; color: var(--ink-3); }

  @media (max-width: 360px) {
    .stats { gap: 6px; }
    .stat { padding: 10px; }
    .stat-value { font-size: 15px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<main class="page" id="app"></main>

<script>
(() => {
  // ── Расписания ────────────────────────────────────────────
  const CATEGORIES = {
    work:   { label: 'Работа',   color: '#5b7cfa' },
    sofra:  { label: 'Sofra',    color: '#f08a3c' },
    study:  { label: 'Обучение', color: '#9a6ad8' },
    sport:  { label: 'Спорт',    color: '#2f9e6a' },
    family: { label: 'Семья',    color: '#e0619a' },
    rest:   { label: 'Отдых',    color: '#98a2b3' },
  }
  const MODES = [
    { id: 'normal', label: 'Обычный день' },
    { id: 'son',    label: 'Сын со мной' },
  ]
  const GOAL = 15

  // id из времени и категории: одинаковые блоки в обоих режимах делят отметку.
  const block = (start, end, category, title, extra = {}) =>
    ({ id: `${start}-${end || '24:00'}-${category}`, start, end, category, title, ...extra })

  const SLEEP_NOTE = 'Лечь до 23:30, чтобы встать в 07:30'

  const morning = (sofraNote) => [
    block('08:00', '09:00', 'sport',  '🏋️ Зал', { optional: true, note: 'Подъём в 07:30: вода и что-то лёгкое' }),
    block('09:00', '10:00', 'family', 'Завтрак / семья'),
    block('10:00', '12:00', 'work',   '💼 Работа'),
    block('12:00', '13:00', 'study',  '📚 Обучение QA'),
    block('13:00', '14:00', 'rest',   'Обед / отдых'),
    block('14:00', '16:00', 'sofra',  '🚀 Sofra', { note: sofraNote }),
    block('16:00', '18:00', 'work',   '💼 Работа / доступность'),
  ]

  const SCHEDULES = {
    normal: [
      ...morning('Если появляется рабочая задача — работа имеет приоритет'),
      block('18:00', '19:30', 'family', 'Семья / отдых'),
      block('19:30', '20:30', 'family', 'Ужин / семья / душ'),
      block('20:30', '22:30', 'sofra',  '🚀 Sofra'),
      block('22:30', null,    'rest',   'Отдых / семья', { note: SLEEP_NOTE }),
    ],
    son: [
      ...morning('Если есть рабочие задачи — переключаюсь на работу'),
      block('18:00', '21:00', 'family', '👨‍👩‍👦 Семья / время с сыном'),
      block('21:00', '22:00', 'family', '👶 Укладывание сына'),
      block('22:00', '23:00', 'sofra',  '🚀 Sofra', { note: 'Только если есть силы. Не обязательный блок.' }),
      block('23:00', null,    'rest',   'Отдых / сон', { note: SLEEP_NOTE }),
    ],
  }

  const toMin = (hhmm) => { if (!hhmm) return 1440; const [h, m] = hhmm.split(':').map(Number); return h * 60 + m }
  const blockHours = (b) => (toMin(b.end) - toMin(b.start)) / 60
  const timeLabel = (b) => (b.end ? `${b.start}–${b.end}` : `После ${b.start}`)
  const fmtH = (n) => (Number.isInteger(n) ? String(n) : n.toFixed(1).replace('.', ','))

  function categoryHours(schedule, done, category) {
    let total = 0, got = 0
    for (const b of schedule) {
      if (b.category !== category) continue
      total += blockHours(b)
      if (done.includes(b.id)) got += blockHours(b)
    }
    return { done: got, total }
  }

  // ── Хранение: одна запись на дату ─────────────────────────
  const PREFIX = 'moy-den:day:'
  const dateKey = (d) =>
    `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`

  function loadDay(key) {
    try {
      const raw = localStorage.getItem(PREFIX + key)
      if (!raw) return { mode: 'normal', done: [] }
      const data = JSON.parse(raw)
      return {
        mode: SCHEDULES[data.mode] ? data.mode : 'normal',
        done: Array.isArray(data.done) ? data.done : [],
      }
    } catch { return { mode: 'normal', done: [] } }
  }

  function saveDay(key, day) {
    try { localStorage.setItem(PREFIX + key, JSON.stringify({ mode: day.mode, done: day.done })) } catch {}
  }

  function weekDays(date) {
    const mon = new Date(date.getFullYear(), date.getMonth(), date.getDate())
    mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7))
    return Array.from({ length: 7 }, (_, i) => { const d = new Date(mon); d.setDate(mon.getDate() + i); return d })
  }

  function weekSofra(date, today) {
    let h = 0
    for (const d of weekDays(date)) {
      const key = dateKey(d)
      const day = key === today.key ? today : loadDay(key)
      h += categoryHours(SCHEDULES[day.mode], day.done, 'sofra').done
    }
    return h
  }

  function formatToday(d) {
    const s = new Intl.DateTimeFormat('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' }).format(d)
    return s.charAt(0).toUpperCase() + s.slice(1)
  }

  function formatWeek(d) {
    const days = weekDays(d), a = days[0], b = days[6]
    const dm = (x) => new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'long' }).format(x)
    return a.getMonth() === b.getMonth() ? `${a.getDate()}–${dm(b)}` : `${dm(a)} – ${dm(b)}`
  }

  // ── Состояние ─────────────────────────────────────────────
  const app = document.getElementById('app')
  let now = new Date()
  let day = { key: dateKey(now), ...loadDay(dateKey(now)) }
  let lastSig = ''

  function update(patch) {
    day = { ...day, ...patch }
    saveDay(day.key, day)
    render()
  }

  const CHECK_SVG = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10.5l3.2 3.2L15 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'

  function stat(cat, label, value, muted) {
    return `<div class="stat">
      <span class="stat-label"><i class="dot" style="background:${CATEGORIES[cat].color}"></i>${label}</span>
      <span class="stat-value${muted ? ' muted' : ''}">${value}</span>
    </div>`
  }

  function render() {
    // Наступил новый день — показываем его состояние (по умолчанию чистое).
    const key = dateKey(now)
    if (day.key !== key) day = { key, ...loadDay(key) }

    const schedule = SCHEDULES[day.mode]
    const nowMin = now.getHours() * 60 + now.getMinutes()
    const sofra = categoryHours(schedule, day.done, 'sofra')
    const study = categoryHours(schedule, day.done, 'study')
    const gym = schedule.some((b) => b.category === 'sport' && day.done.includes(b.id))
    const week = weekSofra(now, day)
    const pct = Math.min(100, (week / GOAL) * 100)

    const focused = document.activeElement && document.activeElement.dataset
      ? (document.activeElement.dataset.toggle ? '[data-toggle="' + document.activeElement.dataset.toggle + '"]'
        : document.activeElement.dataset.mode ? '[data-mode="' + document.activeElement.dataset.mode + '"]' : null)
      : null

    const items = schedule.map((b) => {
      const c = CATEGORIES[b.category]
      const done = day.done.includes(b.id)
      const isNow = nowMin >= toMin(b.start) && nowMin < toMin(b.end)
      return `<li class="item${done ? ' done' : ''}${isNow ? ' now' : ''}" style="--cat:${c.color}">
        <span class="rail" aria-hidden="true"><span class="rail-dot"></span></span>
        <div class="card block">
          <div class="block-body">
            <div class="block-meta">
              <span class="time">${timeLabel(b)}</span>
              <span class="chip"><i class="dot" style="background:${c.color}"></i>${c.label}</span>
              ${b.optional ? '<span class="tag">по желанию</span>' : ''}
              ${isNow ? '<span class="now-tag">сейчас</span>' : ''}
            </div>
            <h3 class="title">${b.title}</h3>
            ${b.note ? `<p class="note">${b.note}</p>` : ''}
          </div>
          <button type="button" class="check" role="checkbox" aria-checked="${done}"
            aria-label="Выполнено: ${b.title}" title="Выполнено" data-toggle="${b.id}">${CHECK_SVG}</button>
        </div>
      </li>`
    }).join('')

    app.innerHTML = `
      <header class="header">
        <h1>Сегодня</h1>
        <p class="date">${formatToday(now)}</p>
      </header>

      <div class="mode" role="radiogroup" aria-label="Какой сегодня день">
        ${MODES.map((m) => `<button type="button" role="radio" aria-checked="${day.mode === m.id}"
          class="mode-btn${day.mode === m.id ? ' active' : ''}" data-mode="${m.id}">${m.label}</button>`).join('')}
      </div>

      <section class="goals" aria-label="Главные цели">
        <span class="section-label">Главные цели</span>
        <span class="goal">🚀 Запустить Sofra</span>
        <span class="goal">💼 Найти хорошую следующую работу</span>
      </section>

      <section class="stats" aria-label="Прогресс дня">
        ${stat('sofra', 'Sofra', `${fmtH(sofra.done)} / ${fmtH(sofra.total)} ч`)}
        ${stat('study', 'Обучение', `${fmtH(study.done)} / ${fmtH(study.total)} ч`)}
        ${stat('sport', 'Зал', gym ? '✓' : 'по желанию', !gym)}
      </section>

      <ol class="timeline" aria-label="Расписание дня">${items}</ol>

      <section class="card week">
        <div class="week-head">
          <h2>Цель Sofra на неделю: ${GOAL} часов</h2>
          <span class="week-value">${fmtH(week)} / ${GOAL} ч</span>
        </div>
        <div class="bar" role="progressbar" aria-label="Часы Sofra за неделю"
          aria-valuemin="0" aria-valuemax="${GOAL}" aria-valuenow="${week}">
          <div class="bar-fill" style="width:${pct}%"></div>
        </div>
        <p class="week-range">Неделя ${formatWeek(now)}</p>
      </section>`

    if (focused) { const el = app.querySelector(focused); if (el) el.focus() }
    lastSig = key + '|' + schedule.findIndex((b) => nowMin >= toMin(b.start) && nowMin < toMin(b.end))
  }

  app.addEventListener('click', (e) => {
    const t = e.target.closest('[data-toggle], [data-mode]')
    if (!t) return
    if (t.dataset.mode) { update({ mode: t.dataset.mode }); return }
    const id = t.dataset.toggle
    update({ done: day.done.includes(id) ? day.done.filter((x) => x !== id) : [...day.done, id] })
  })

  // Часы: раз в 30 секунд и при возвращении на вкладку. Перерисовываем, только
  // если сменился день или текущий блок.
  function tick() {
    now = new Date()
    const nowMin = now.getHours() * 60 + now.getMinutes()
    const sig = dateKey(now) + '|' + SCHEDULES[day.mode].findIndex((b) => nowMin >= toMin(b.start) && nowMin < toMin(b.end))
    if (sig !== lastSig) render()
  }
  setInterval(tick, 30000)
  window.addEventListener('focus', tick)
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') tick() })

  render()
})()
</script>

</body>
</html>
